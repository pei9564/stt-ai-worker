services:
  stt-ai-worker:
    image: stt-ai-worker:latest
    container_name: stt-ai-worker
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./output:/data/output
      - /home/user/Models:/root/.cache/huggingface
    restart: unless-stopped
    # GPU 模式 (.env 設 DEVICE=cuda 時需要)。
    # 若要改成純 CPU，把 .env 的 DEVICE 改成 cpu，並可註解掉下面整段 deploy。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
