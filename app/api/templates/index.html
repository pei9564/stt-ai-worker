<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast 轉文字</title>
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #ffffff;
    --border: #e4ddd4;
    --border-light: #ede9e3;
    --text: #2c2825;
    --text-muted: #9a9490;
    --text-secondary: #6b6560;
    --accent: #5b7fa6;
    --accent-hover: #4a6e93;

    --badge-queued-bg: #ede9e3;
    --badge-queued-fg: #7a7570;
    --badge-running-bg: #deeaf7;
    --badge-running-fg: #2f5f8a;
    --badge-done-bg: #d8edd8;
    --badge-done-fg: #2d6b2d;
    --badge-error-bg: #fce8e8;
    --badge-error-fg: #993030;

    --danger: #993030;
    --danger-bg: #fce8e8;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 780px;
    margin: 48px auto;
    padding: 0 20px;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }

  .meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  /* GPU bar */
  .gpubar {
    font-size: 0.8rem;
    padding: 7px 12px;
    border-radius: 6px;
    margin-bottom: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-family: ui-monospace, monospace;
    color: var(--text-secondary);
  }
  .gpubar.warm { background: #fff8ec; border-color: #f0d9a0; color: #7a5c00; }
  .gpubar.hot  { background: var(--badge-error-bg); border-color: #f0b0b0; color: var(--danger); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--border);
    margin-bottom: 24px;
  }
  .tab {
    padding: 8px 18px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.9rem;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* Form elements */
  label {
    display: block;
    margin: 16px 0 5px;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--text);
  }
  .hint { font-size: 0.78rem; color: var(--text-muted); font-weight: normal; }

  input[type=text], input[type=file], select {
    width: 100%;
    padding: 8px 10px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  input[type=file] { padding: 6px 8px; color: var(--text-secondary); }
  select { width: auto; min-width: 120px; }

  input[type=text][style*="width:80px"] { width: 80px; }

  /* Buttons */
  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 8px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s, color 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.45; cursor: default; }

  .btn-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: #f0b0b0;
    font-size: 0.82rem;
    padding: 5px 12px;
    margin-top: 0;
    margin-bottom: 14px;
  }
  .btn-danger:hover { background: #f9d0d0; }

  button:disabled { opacity: 0.45; cursor: default; }

  /* Inline action buttons for job rows */
  .btn-sm {
    padding: 2px 9px;
    font-size: 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    margin-left: 6px;
    transition: background 0.12s;
  }
  .btn-sm:hover { background: var(--border-light); }
  .btn-sm.danger { color: var(--danger); border-color: #f0b0b0; }
  .btn-sm.danger:hover { background: var(--badge-error-bg); }

  /* Status & result */
  #status, #feedStatus {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--text-secondary);
    white-space: pre-wrap;
  }

  textarea {
    width: 100%;
    height: 280px;
    margin-top: 14px;
    font-family: ui-monospace, monospace;
    font-size: 0.82rem;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  /* Jobs panel */
  .jobs-header {
    font-size: 0.8rem;
    color: var(--text-muted);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-light);
    margin-bottom: 4px;
  }

  .jobrow {
    display: flex;
    align-items: center;
    padding: 9px 4px;
    border-bottom: 1px solid var(--border-light);
    gap: 10px;
    font-size: 0.88rem;
  }
  .jobrow.clickable { cursor: pointer; }
  .jobrow.clickable:hover { background: #faf8f5; border-radius: 4px; }

  .job-title {
    flex: 1;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .job-meta {
    font-size: 0.78rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .job-actions {
    display: flex;
    gap: 0;
    flex-shrink: 0;
  }
  .job-error {
    font-size: 0.78rem;
    color: var(--danger);
    padding: 2px 4px 0;
    grid-column: 1 / -1;
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 58px;
    justify-content: center;
  }
  .badge.queued  { background: var(--badge-queued-bg);  color: var(--badge-queued-fg); }
  .badge.running { background: var(--badge-running-bg); color: var(--badge-running-fg); }
  .badge.done    { background: var(--badge-done-bg);    color: var(--badge-done-fg); }
  .badge.error   { background: var(--badge-error-bg);   color: var(--badge-error-fg); }

  #cancelMsg { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
</style>
</head>
<body>
<h1>Podcast 轉文字</h1>
<p class="meta">模型: __MODEL__ &nbsp;·&nbsp; 裝置: __DEVICE__ &nbsp;·&nbsp; 預設批次: __BATCH__</p>
<div id="gpu" class="gpubar">GPU: 載入中…</div>

<div class="tabs">
  <div class="tab active" data-tab="file">本地檔案</div>
  <div class="tab" data-tab="url">YouTube / 連結</div>
  <div class="tab" data-tab="feed">RSS 整季</div>
  <div class="tab" data-tab="jobs">任務</div>
</div>

  <div class="panel active" id="panel-file">
    <label>音檔 (mp3 / m4a / wav / …)</label>
    <input type="file" id="file" accept="audio/*,video/*">
    <label>語言</label>
    <select id="lang-file">__LANGOPTS__</select>
    <label>批次大小 <span class="hint">越大越快、GPU 越熱</span></label>
    <select id="batch-file">__BATCHOPTS__</select>
    <label>Topic <span class="hint">選填；留空用檔名</span></label>
    <input type="text" id="topic-file" placeholder="(選填)">
    <br><button class="btn btn-primary" onclick="doTranscribe('file')">加入佇列</button>
  </div>

  <div class="panel" id="panel-url">
    <label>YouTube 或影音 / podcast 單集網址</label>
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=…">
    <label>語言</label>
    <select id="lang-url">__LANGOPTS__</select>
    <label>批次大小 <span class="hint">越大越快、GPU 越熱</span></label>
    <select id="batch-url">__BATCHOPTS__</select>
    <label>Topic <span class="hint">選填；留空用影片標題</span></label>
    <input type="text" id="topic-url" placeholder="(選填)">
    <br><button class="btn btn-primary" onclick="doTranscribe('url')">加入佇列</button>
  </div>

  <div class="panel" id="panel-feed">
    <label>Podcast RSS Feed 網址</label>
    <input type="text" id="feed" placeholder="https://…/feed.xml">
    <label>抓幾集 <span class="hint">0 = 整季全抓，從最新往回</span></label>
    <input type="text" id="feedLimit" value="3" style="width:80px">
    <label>語言</label>
    <select id="lang-feed">__LANGOPTS__</select>
    <label>批次大小 <span class="hint">整季長時間跑，建議 1~4 較不燒機</span></label>
    <select id="batch-feed">__BATCHOPTS__</select>
    <br><button class="btn btn-primary" onclick="startFeed()">加入佇列（每集一個 job）</button>
    <div id="feedStatus"></div>
  </div>

  <div class="panel" id="panel-jobs">
    <p class="hint" style="margin:0 0 12px;">過去 48 小時內的所有 job，每 5 秒自動更新。點「done」的項目可載入逐字稿。</p>
    <button class="btn btn-danger" onclick="cancelAll()">取消所有排隊中的 job</button>
    <div id="cancelMsg"></div>
    <div id="jobsList">載入中…</div>
  </div>

  <div id="status"></div>
  <textarea id="result" placeholder="完成的逐字稿會顯示在這；所有結果都存到 output/{日期}/ 資料夾"></textarea>

<script>
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
  if (t.dataset.tab === 'jobs') startJobsPanel(); else stopJobsPanel();
});

const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const pollTimers = {};

async function doTranscribe(mode) {
  const fd = new FormData();
  fd.append('language', document.getElementById('lang-' + mode).value);
  fd.append('batch_size', document.getElementById('batch-' + mode).value);
  fd.append('topic', document.getElementById('topic-' + mode).value.trim());
  let url;
  if (mode === 'file') {
    const f = document.getElementById('file').files[0];
    if (!f) { statusEl.textContent = '請先選擇音檔'; return; }
    fd.append('file', f);
    url = '/transcribe';
  } else {
    const u = document.getElementById('url').value.trim();
    if (!u) { statusEl.textContent = '請輸入網址'; return; }
    fd.append('url', u);
    url = '/transcribe_url';
  }
  resultEl.value = '';
  statusEl.textContent = '送出中…';
  try {
    const r = await fetch(url, { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || '送出失敗');
    pollJob(data.job_id);
  } catch (e) {
    statusEl.textContent = '錯誤: ' + e.message;
  }
}

function pollJob(jobId) {
  if (pollTimers[jobId]) clearInterval(pollTimers[jobId]);
  const tick = async () => {
    try {
      const d = await (await fetch('/job/' + jobId)).json();
      if (d.status === 'queued') {
        statusEl.textContent = `job ${jobId} 排隊中…`;
      } else if (d.status === 'running') {
        statusEl.textContent = `job ${jobId} 轉檔中…`;
      } else if (d.status === 'done') {
        clearInterval(pollTimers[jobId]);
        statusEl.textContent = `job ${jobId} 完成 | 語言 ${d.language} | 長度 ${d.duration.toFixed(1)}s | 已存 ${d.txt_file}`;
        resultEl.value = d.text;
      } else if (d.status === 'error') {
        clearInterval(pollTimers[jobId]);
        statusEl.textContent = `job ${jobId} 失敗: ${d.error}`;
      }
    } catch (e) {
      statusEl.textContent = 'job 查詢失敗: ' + e.message;
    }
  };
  pollTimers[jobId] = setInterval(tick, 3000);
  tick();
}

async function startFeed() {
  const feed = document.getElementById('feed').value.trim();
  const fs = document.getElementById('feedStatus');
  if (!feed) { fs.textContent = '請輸入 RSS 網址'; return; }
  const fd = new FormData();
  fd.append('feed_url', feed);
  fd.append('limit', document.getElementById('feedLimit').value || '0');
  fd.append('language', document.getElementById('lang-feed').value);
  fd.append('batch_size', document.getElementById('batch-feed').value);
  fs.textContent = '解析 RSS 中，請稍候…';
  try {
    const r = await fetch('/transcribe_feed', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
    if (data.count === 0) {
      fs.textContent = '⚠ RSS 解析成功但找不到任何音檔集數（可能是 enclosure 格式不符）';
    } else {
      fs.textContent = `已排入 ${data.count} 集，到「任務」分頁追蹤進度`;
    }
  } catch (e) {
    fs.textContent = '錯誤: ' + e.message;
  }
}

async function cancelAll() {
  const msg = document.getElementById('cancelMsg');
  msg.textContent = '取消中…';
  try {
    const r = await fetch('/jobs/cancel-all', { method: 'POST' });
    const d = await r.json();
    msg.textContent = d.message;
    renderJobs();
  } catch (e) {
    msg.textContent = '取消失敗: ' + e.message;
  }
}

let jobsTimer = null;
function startJobsPanel() {
  if (jobsTimer) clearInterval(jobsTimer);
  jobsTimer = setInterval(renderJobs, 5000);
  renderJobs();
}
function stopJobsPanel() {
  if (jobsTimer) { clearInterval(jobsTimer); jobsTimer = null; }
}

async function renderJobs() {
  const box = document.getElementById('jobsList');
  try {
    const d = await (await fetch('/jobs')).json();
    if (!d.jobs.length) { box.textContent = '（48 小時內沒有 job）'; return; }
    box.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'jobs-header';
    header.textContent = `佇列中 ${d.queue_size} 個待處理 · 共 ${d.jobs.length} 筆`;
    box.appendChild(header);

    d.jobs.forEach(j => {
      const row = document.createElement('div');
      row.className = 'jobrow' + (j.status === 'done' ? ' clickable' : '');

      const rawTitle = j.topic
        || (j.txt_file && j.txt_file.split('/').pop())
        || j.id;
      const title = rawTitle.replace(/\.[a-zA-Z0-9]+$/, '');
      const when = (j.finished_at || j.created_at || '').replace('T', ' ');

      const badge = document.createElement('span');
      badge.className = 'badge ' + j.status;
      badge.textContent = j.status;

      const titleEl = document.createElement('span');
      titleEl.className = 'job-title';
      titleEl.textContent = title;

      const metaEl = document.createElement('span');
      metaEl.className = 'job-meta';
      metaEl.textContent = j.type + ' · ' + when;

      const actions = document.createElement('span');
      actions.className = 'job-actions';

      if (j.status === 'done') {
        row.onclick = () => viewJobResult(j.id);
      } else if (j.status === 'queued') {
        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = '取消';
        cancelBtn.className = 'btn-sm';
        cancelBtn.onclick = async (e) => {
          e.stopPropagation();
          cancelBtn.disabled = true;
          await fetch('/job/' + j.id + '/cancel', { method: 'POST' });
          renderJobs();
        };
        actions.appendChild(cancelBtn);
      } else if (j.status === 'error') {
        const errEl = document.createElement('span');
        errEl.className = 'job-error';
        errEl.textContent = j.error || '';
        row.appendChild(badge);
        row.appendChild(titleEl);
        row.appendChild(metaEl);
        row.appendChild(actions);
        row.appendChild(errEl);

        if (j.status !== 'running') {
          const delBtn = document.createElement('button');
          delBtn.textContent = '刪除';
          delBtn.className = 'btn-sm danger';
          delBtn.onclick = async (e) => {
            e.stopPropagation();
            delBtn.disabled = true;
            await fetch('/job/' + j.id, { method: 'DELETE' });
            renderJobs();
          };
          actions.appendChild(delBtn);
        }

        box.appendChild(row);
        return;
      }

      if (j.status !== 'running') {
        const delBtn = document.createElement('button');
        delBtn.textContent = '刪除';
        delBtn.className = 'btn-sm danger';
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          delBtn.disabled = true;
          await fetch('/job/' + j.id, { method: 'DELETE' });
          renderJobs();
        };
        actions.appendChild(delBtn);
      }

      row.appendChild(badge);
      row.appendChild(titleEl);
      row.appendChild(metaEl);
      row.appendChild(actions);
      box.appendChild(row);
    });
  } catch (e) {
    box.textContent = 'job 清單載入失敗: ' + e.message;
  }
}

async function viewJobResult(jobId) {
  statusEl.textContent = '載入逐字稿…';
  try {
    const d = await (await fetch('/job/' + jobId)).json();
    if (d.status !== 'done') { statusEl.textContent = `job ${jobId} 狀態: ${d.status}`; return; }
    statusEl.textContent = `job ${jobId} | 語言 ${d.language} | 長度 ${d.duration.toFixed(1)}s | 已存 ${d.txt_file}`;
    resultEl.value = d.text;
  } catch (e) {
    statusEl.textContent = '載入失敗: ' + e.message;
  }
}

async function pollGpu() {
  const el = document.getElementById('gpu');
  try {
    const d = await (await fetch('/gpu')).json();
    if (!d.available) { el.textContent = 'GPU: 無法讀取 ' + (d.error || ''); return; }
    const pwr = d.power != null ? d.power.toFixed(0) + 'W' : 'N/A';
    el.textContent = `GPU  使用率 ${d.util}%   VRAM ${d.mem_used.toFixed(0)}/${d.mem_total.toFixed(0)} MiB   功耗 ${pwr}   溫度 ${d.temp.toFixed(0)}°C`;
    el.className = 'gpubar' + (d.temp >= 85 ? ' hot' : d.temp >= 75 ? ' warm' : '');
  } catch (e) {
    el.textContent = 'GPU: 連線失敗';
  }
}
setInterval(pollGpu, 2000);
pollGpu();
</script>
</body>
</html>
